<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Application | DTE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:900px;margin:35px auto;padding:15px}.head{background:linear-gradient(110deg,#071a38,#0b4771);color:#fff;padding:28px;border-radius:16px;margin-bottom:20px}.head h1{font-size:26px;margin-bottom:8px}.head p{color:#c7d7e7;font-size:13px;line-height:1.6}.card{background:#fff;border:1px solid #e0e6ee;border-radius:14px;padding:24px;margin-bottom:18px}.title{font-size:17px;font-weight:700;color:#10233f;margin-bottom:17px;padding-bottom:10px;border-bottom:1px solid #edf0f4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#536277;margin-bottom:7px}input,select,textarea{width:100%;padding:12px;border:1px solid #d8e0e9;border-radius:8px;font-size:13px;background:#fff}input[readonly]{background:#f4f7fa}.photo{text-align:center;border:1px dashed #aebdcd;padding:15px;border-radius:9px}.preview{display:none;width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #14a6df;margin:0 auto 10px}.help{font-size:10px;color:#7d8a9b;margin-top:6px}.agree{display:flex;gap:9px;font-size:12px;color:#536277;line-height:1.5}.agree input{width:auto;margin-top:3px}.msg{display:none;padding:12px;border-radius:8px;margin-bottom:16px;font-size:12px}.error{background:#fff0f0;color:#a52c2c;border:1px solid #efb7b7}.success{background:#ecf9f1;color:#187445;border:1px solid #b8e3ca}button{width:100%;padding:14px;border:0;border-radius:9px;background:#0b4771;color:#fff;font-size:14px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}@media(max-width:650px){.wrap{margin:15px auto}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><h1>Complete Your Application</h1><p>This application is mandatory for your DTE Learning Portal profile. Please provide correct information and submit it once.</p></div>
<div id="msg" class="msg"></div>
<form id="applicationForm">
<div class="card"><div class="title">Personal Details</div><div class="grid">
<div><label>Full Name</label><input id="name" readonly></div>
<div><label>Email Address</label><input id="email" type="email" readonly></div>
<div><label>Mobile / WhatsApp Number *</label><input id="mobile" type="tel" required></div>
<div><label>Date of Birth *</label><input id="dob" type="date" required></div>
<div><label>Gender *</label><select id="gender" required><option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option></select></div>
<div><label>Profile Photo *</label><div class="photo"><img id="preview" class="preview"><input id="photo" type="file" accept="image/*" required><div class="help">JPG/PNG. Photo is compressed before saving.</div></div></div>
</div></div>
<div class="card"><div class="title">Education Details</div><div class="grid">
<div><label>Current Course / Education *</label><input id="course" required></div><div><label>Year / Semester *</label><input id="yearSemester" required></div>
<div class="full"><label>College / Institute Name *</label><input id="college" required></div></div></div>
<div class="card"><div class="title">Learning Information</div><div class="grid">
<div class="full"><label>Areas You Are Interested In *</label><input id="interests" placeholder="Cyber Security, Website Development, AI..." required></div>
<div><label>Do you have a laptop? *</label><select id="laptop" required><option value="">Select</option><option>Yes</option><option>No</option></select></div>
<div><label>Learning Mode</label><input id="mode" readonly></div>
<div class="full"><label>Why do you want to join this program? *</label><textarea id="reason" required></textarea></div></div></div>
<div class="card"><div class="title">Declaration</div><label class="agree"><input id="agree" type="checkbox" required><span>I confirm that the information provided by me is correct and I agree to participate in the DTE Learning Program and follow its guidelines.</span></label></div>
<div class="card"><button id="submitButton" type="submit">Submit Application</button></div>
</form></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB9baNNbsawnpeZRqmTCsNG6MKpNd2FyHc",authDomain:"dte-learning-portal.firebaseapp.com",projectId:"dte-learning-portal",storageBucket:"dte-learning-portal.firebasestorage.app",messagingSenderId:"229529830631",appId:"1:229529830631:web:970c1c827d05795bca4e42"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null;
const msg=document.getElementById("msg"),form=document.getElementById("applicationForm"),btn=document.getElementById("submitButton");
function show(text,type="error"){msg.textContent=text;msg.className="msg "+type;msg.style.display="block"}
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const max=500,s=Math.min(max/i.width,max/i.height,1),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.72))};i.onerror=reject;i.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
document.getElementById("photo").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=x=>{document.getElementById("preview").src=x.target.result;document.getElementById("preview").style.display="block"};r.readAsDataURL(f)});
onAuthStateChanged(auth,async u=>{if(!u){location.replace("login.html");return}user=u;try{const s=await getDoc(doc(db,"Students",u.uid));if(!s.exists()||String(s.data().status||"").toLowerCase()!=="active"){location.replace("login.html");return}const a=await getDoc(doc(db,"Applications",u.uid));if(a.exists()){location.replace("dashboard.html");return}const d=s.data();document.getElementById("name").value=d.name||u.displayName||"";document.getElementById("email").value=d.email||u.email||"";document.getElementById("mobile").value=d.mobile||"";document.getElementById("mode").value=d.mode||"Offline"}catch(e){console.error(e);show("Unable to load your application. Please try again.")}});
form.addEventListener("submit",async e=>{e.preventDefault();if(!user)return;const f=document.getElementById("photo").files[0];if(!f)return show("Please select your profile photo.");btn.disabled=true;btn.textContent="Submitting Application...";try{const ref=doc(db,"Applications",user.uid);if((await getDoc(ref)).exists()){location.replace("dashboard.html");return}const photo=await compress(f);if(photo.length>900000)throw Error("Photo is too large. Please choose a smaller image.");await setDoc(ref,{studentId:user.uid,name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim(),mobile:document.getElementById("mobile").value.trim(),dob:document.getElementById("dob").value,gender:document.getElementById("gender").value,course:document.getElementById("course").value.trim(),yearSemester:document.getElementById("yearSemester").value.trim(),college:document.getElementById("college").value.trim(),interests:document.getElementById("interests").value.trim(),laptop:document.getElementById("laptop").value,mode:document.getElementById("mode").value,reason:document.getElementById("reason").value.trim(),photoData:photo,status:"Submitted",submittedAt:serverTimestamp()});show("Application submitted successfully. Redirecting...","success");setTimeout(()=>location.replace("dashboard.html"),1200)}catch(e){console.error(e);show(e.message||"Unable to submit application.");btn.disabled=false;btn.textContent="Submit Application"}});
</script></body></html>
