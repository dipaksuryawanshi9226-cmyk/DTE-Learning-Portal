<!-- ================= LEARNING SESSIONS ================= -->

<div class="card">

    <div class="card-header">

        <h3>Learning Sessions</h3>

        <span>
            Current Track
        </span>

    </div>


    <!--
        SESSION DATA WILL COME FROM FIRESTORE LATER

        When there are no sessions,
        this message will be displayed.

        Later:
        Upcoming session -> date/time/status shown
        Completed session -> completed list
    -->


    <div
        id="noSessionsMessage"
        style="
            text-align:center;
            padding:40px 20px;
        "
    >

        <div
            style="
                width:60px;
                height:60px;
                margin:0 auto 15px;
                border-radius:50%;
                background:#eef6fb;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:26px;
            "
        >
            📚
        </div>


        <h3
            style="
                color:#273951;
                font-size:15px;
                margin-bottom:6px;
            "
        >
            No Learning Sessions Yet
        </h3>


        <p
            style="
                color:#8b97a8;
                font-size:11px;
            "
        >
            Your learning sessions will appear here
            when they are announced by DTE.
        </p>

    </div>


    <!--
        FIRESTORE SESSION LIST

        Later JavaScript will automatically
        add Upcoming / Completed sessions here.
    -->

    <div id="sessionsContainer"></div>

</div>
